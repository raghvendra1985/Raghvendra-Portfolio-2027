  <text x="160" y="620" font-family="ui-monospace, monospace" font-size="16" letter-spacing="3" fill="#EBEDE3" fill-opacity="0.5">EDITORIAL · LOOKBOOK</text>
  <!-- Side stack -->
  <rect x="780" y="200" width="300" height="280" fill="#124D1C"/>
  <text x="810" y="280" font-family="Georgia, serif" font-size="28" fill="#EBEDE3">Silhouette</text>
  <text x="810" y="320" font-family="ui-monospace, monospace" font-size="14" fill="#EBEDE3" fill-opacity="0.55">Structure</text>
