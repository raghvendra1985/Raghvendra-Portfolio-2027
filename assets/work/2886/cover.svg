  <text x="810" y="590" font-family="Georgia, serif" font-size="28" fill="#0B1849">Material</text>
  <text x="810" y="630" font-family="ui-monospace, monospace" font-size="14" fill="#0B1849" fill-opacity="0.55">Handwork</text>
  <rect x="780" y="820" width="300" height="280" fill="#0B1849"/>
  <text x="810" y="900" font-family="Georgia, serif" font-size="28" fill="#EBEDE3">Cut</text>
