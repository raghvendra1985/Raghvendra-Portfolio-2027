<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" role="img" aria-label="2886 fashion editorial craft presentation">
  <rect width="1200" height="1500" fill="#EBEDE3"/>
  <!-- Editorial frame -->
  <rect x="80" y="80" width="1040" height="1340" fill="none" stroke="#0B1849" stroke-width="2"/>
  <rect x="80" y="80" width="1040" height="80" fill="#0B1849"/>
  <text x="110" y="130" font-family="ui-monospace, monospace" font-size="18" letter-spacing="6" fill="#E4B028">2886</text>
  <text x="900" y="130" font-family="ui-monospace, monospace" font-size="16" letter-spacing="3" fill="#EBEDE3" fill-opacity="0.6">CRAFT</text>
  <!-- Large editorial panel -->
  <rect x="120" y="200" width="620" height="900" fill="#0B1849"/>
  <rect x="160" y="260" width="80" height="6" fill="#E4B028"/>
