  <line x1="120" y1="1160" x2="1080" y2="1160" stroke="#0B1849" stroke-opacity="0.25"/>
  <text x="120" y="1220" font-family="Georgia, serif" font-size="28" fill="#0B1849">Fashion on the web with a point of view.</text>
  <text x="120" y="1280" font-family="ui-monospace, monospace" font-size="16" letter-spacing="3" fill="#0B1849" fill-opacity="0.5">DESIGNER · CLIENT WORK</text>
  <text x="80" y="1460" font-family="ui-monospace, monospace" font-size="18" letter-spacing="6" fill="#0B1849" fill-opacity="0.4">04 · 2886</text>
